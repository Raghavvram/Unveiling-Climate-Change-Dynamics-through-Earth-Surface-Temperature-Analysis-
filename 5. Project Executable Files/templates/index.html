<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="light dark" />
        <script src="https://cdn.tailwindcss.com"></script>
        <title>Surface Temperature Analysis</title>
        <style>
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .fade-in {
                animation: fadeIn 0.8s ease-out forwards;
            }
        </style>
    </head>

    <body class="bg-gradient-to-br from-gray-50 to-gray-200 dark:from-gray-900 dark:to-gray-700 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 lg:p-8">
        <h1 class="text-4xl sm:text-5xl font-extrabold mb-10 text-center text-indigo-700 dark:text-indigo-400 leading-tight fade-in">
            UNVEILING CLIMATE CHANGE DYNAMICS THROUGH EARTH SURFACE TEMPERATURE ANALYSIS
        </h1>

        <div class="w-full max-w-4xl mx-auto bg-white dark:bg-gray-800 rounded-xl shadow-2xl p-8 sm:p-10 lg:p-12 space-y-8 fade-in transform transition-all duration-500 hover:scale-105">
            <h2 class="text-3xl font-bold text-center text-gray-800 dark:text-gray-100">Input Data for Prediction</h2>
            <hr class="border-gray-300 dark:border-gray-600">

            <form action="/response" method="Post" class="grid grid-cols-1 md:grid-cols-2 gap-8">

                <div>
                    <label for="LandAverageTemperatureUncertainty" class="block text-base font-medium text-gray-700 dark:text-gray-200 mb-2">Land Average Temperature Uncertainty</label>
                    <input type="number" id="LandAverageTemperatureUncertainty" name="LandAverageTemperatureUncertainty" placeholder="Enter a Valid Number" step="any" required
                           class="mt-1 block w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-base bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100 transition duration-150 ease-in-out">
                </div>

                <div>
                    <label for="LandMaxTemperature" class="block text-base font-medium text-gray-700 dark:text-gray-200 mb-2">Land Max Temperature</label>
                    <input type="number" id="LandMaxTemperature" name="LandMaxTemperature" placeholder="Enter a Valid Number" step="any" required
                           class="mt-1 block w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-base bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100 transition duration-150 ease-in-out">
                </div>

                <div>
                    <label for="LandMaxTemperatureUncertainty" class="block text-base font-medium text-gray-700 dark:text-gray-200 mb-2">Land Max Temperature Uncertainty</label>
                    <input type="number" id="LandMaxTemperatureUncertainty" name="LandMaxTemperatureUncertainty" placeholder="Enter a Valid Number" step="any" required
                           class="mt-1 block w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-base bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100 transition duration-150 ease-in-out">
                </div>

                <div>
                    <label for="LandMinTemperature" class="block text-base font-medium text-gray-700 dark:text-gray-200 mb-2">Land Min Temperature</label>
                    <input type="number" id="LandMinTemperature" name="LandMinTemperature" placeholder="Enter a Valid Number" step="any" required
                           class="mt-1 block w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-base bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100 transition duration-150 ease-in-out">
                </div>

                <div>
                    <label for="LandMinTemperatureUncertainty" class="block text-base font-medium text-gray-700 dark:text-gray-200 mb-2">Land Min Temperature Uncertainty</label>
                    <input type="number" id="LandMinTemperatureUncertainty" name="LandMinTemperatureUncertainty" placeholder="Enter a Valid Number" step="any" required
                           class="mt-1 block w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-base bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100 transition duration-150 ease-in-out">
                </div>

                <div>
                    <label for="LandAndOceanAverageTemperature" class="block text-base font-medium text-gray-700 dark:text-gray-200 mb-2">Land And Ocean Average Temperature</label>
                    <input type="number" id="LandAndOceanAverageTemperature" name="LandAndOceanAverageTemperature" placeholder="Enter a Valid Number" step="any" required
                           class="mt-1 block w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-base bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100 transition duration-150 ease-in-out">
                </div>

                <div>
                    <label for="LandAndOceanAverageTemperatureUncertainty" class="block text-base font-medium text-gray-700 dark:text-gray-200 mb-2">Land And Ocean Average Temperature Uncertainty</label>
                    <input type="number" id="LandAndOceanAverageTemperatureUncertainty" name="LandAndOceanAverageTemperatureUncertainty" placeholder="Enter a Valid Number" step="any" required
                           class="mt-1 block w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 text-base bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100 transition duration-150 ease-in-out">
                </div>

                <div class="md:col-span-2 flex flex-col sm:flex-row justify-center items-center mt-8 pt-6 border-t border-gray-200 dark:border-gray-700">
                    <button type="submit" class="w-full sm:w-auto flex justify-center py-3 px-8 border border-transparent rounded-full shadow-lg text-lg font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-300 ease-in-out transform hover:-translate-y-1">
                        Submit for Prediction
                    </button>

                    <div class="relative inline-block text-left mt-6 sm:mt-0 sm:ml-6">
                        <details class="dropdown">
                            <summary class="inline-flex justify-center w-full rounded-full border border-gray-300 dark:border-gray-600 shadow-sm px-6 py-3 bg-white dark:bg-gray-700 text-base font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out" id="menu-button" aria-expanded="true" aria-haspopup="true">
                                Theme
                                <svg class="-mr-1 ml-2 h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                    <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                                </svg>
                            </summary>

                            <ul class="origin-top-right absolute right-0 mt-2 w-36 rounded-md shadow-lg bg-white dark:bg-gray-700 ring-1 ring-black ring-opacity-5 focus:outline-none z-10" role="menu" aria-orientation="vertical" aria-labelledby="menu-button" tabindex="-1">
                                <li><a href="#" data-theme-switcher="auto" class="text-gray-700 dark:text-gray-200 block px-4 py-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-600" role="menuitem" tabindex="-1" id="menu-item-0">Auto</a></li>
                                <li><a href="#" data-theme-switcher="light" class="text-gray-700 dark:text-gray-200 block px-4 py-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-600" role="menuitem" tabindex="-1" id="menu-item-1">Light</a></li>
                                <li><a href="#" data-theme-switcher="dark" class="text-gray-700 dark:text-gray-200 block px-4 py-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-600" role="menuitem" tabindex="-1" id="menu-item-2">Dark</a></li>
                            </ul>
                        </details>
                    </div>
                </div>
            </form>
        </div>

        <script type="text/javascript" src="{{url_for('static',filename='minimal-theme-switcher.js')}}"></script>
    </body>
</html>
